scorer_type: "user"
scorer_name: "new_llm_scorer"
scorer_prompt: |
  Act as a judge LLM model, you are evaluating the sentiment of the response.
  [BEGIN DATA]
  [Output]:
  {{llm_output}}
  ************
  [END DATA]
output_format_type: "Choices"
score_description: "Checks Sentiment of the output generated by LLM"
scorer_variables:
  - name: "llm_output"
    required: true
output_categories:
  - name: "A"
    color: "green"
    value: "1"
  - name: "B"
    color: "yellow"
    value: "0.50"
  - name: "C"
    color: "blue"
    value: "0.10"
  - name: "D"
    color: "black"
    value: "0.75"
  - name: "E"
    color: "red"
    value: "0"
eval_model:
  model_name: "OPENAI"
  model_version: "gpt-4"
  model_properties:
    temperature: 0
    max_tokens: 1000
